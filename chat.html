<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat La Comarca - Diseño Compacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primario: #2c3e50; 
            --acento: #e67e22; 
            --espera: rgba(241, 196, 15, 0.75); /* Amarillo Transparente */
            --viaje: rgba(46, 204, 113, 0.75);  /* Verde Transparente */
            --normal-user: rgba(255, 255, 255, 0.6); /* Blanco muy transparente */
            --normal-other: rgba(44, 62, 80, 0.6);  /* Oscuro muy transparente */
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            /* Fondo que ocupa TODO */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('El-Bolson-Ph_-M.-Luz-Cardozo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }
        
        header { 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(10px);
            color: white; 
            padding: 10px; 
            text-align: center; 
            z-index: 10;
        }
        
        #chat-messages { 
            flex-grow: 1; 
            padding: 15px; /* Menos padding para ganar espacio */
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; /* Espacio más estrecho entre burbujas */
        }

        /* --- NUEVO ESTILO DE BURBUJA COMPACTA Y BONITA --- */
        .msg { 
            padding: 8px 12px; /* Mucho más compacto */
            border-radius: 16px; /* Bordes más suaves */
            max-width: 70%; /* No ocupan todo el ancho, solo el 70% */
            backdrop-filter: blur(6px); /* Efecto cristal */
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); /* Sombra más sutil */
            color: white;
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
            position: relative;
            line-height: 1.3; /* Texto más junto */
        }

        /* Alineación y Colores Base */
        .msg.user { align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; border-bottom-left-radius: 4px; }

        /* Colores por Estado (Globo Completo con Transparencia) */
        .msg.ninguno.user { background: var(--normal-user); color: #222; text-shadow: none; }
        .msg.ninguno.other { background: var(--normal-other); }
        
        /* Centrados pero COMPACTOS */
        .msg.espera { background: var(--espera); color: #111; text-shadow: none; align-self: center; max-width: 80%; }
        .msg.viaje { background: var(--viaje); align-self: center; max-width: 80%; }

        /* Estilo para la Hora y Estado dentro del globo */
        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            opacity: 0.8;
            margin-top: 3px;
            font-weight: 500;
        }

        /* --- FIN NUEVO ESTILO --- */

        /* UI Inferior Transparente */
        .area-inferior {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .selector-estado { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            padding: 8px; 
        }

        .opcion-estado {
            font-size: 10px; 
            font-weight: 700; 
            padding: 6px 12px; 
            border-radius: 20px;
            cursor: pointer; 
            border: 1.5px solid rgba(255,255,255,0.3);
            transition: 0.3s;
            color: white;
            background: rgba(0,0,0,0.2);
        }
        .opcion-estado.active { 
            background: white !important; 
            color: black !important;
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }

        .input-area { 
            padding: 8px 15px 15px; 
            display: flex; 
            gap: 10px; 
        }

        input { 
            flex-grow: 1; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 25px; 
            outline: none; 
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .btn-send { 
            background: var(--acento); 
            color: white; 
            border: none; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header><h3>🏔️ LA COMARCA</h3></header>

    <div id="chat-messages"></div>

    <div class="area-inferior">
        <div class="selector-estado" id="selector-estado">
            <div class="opcion-estado active" onclick="setEstado('ninguno', this)">NORMAL</div>
            <div class="opcion-estado" onclick="setEstado('espera', this)" style="border-color: #f1c40f;">ESPERANDO</div>
            <div class="opcion-estado" onclick="setEstado('viaje', this)" style="border-color: #2ecc71;">EN VIAJE</div>
        </div>

        <div class="input-area">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
            <button class="btn-send" onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7FUrAK478GwlfGg-GTU15G683zQ3rWU0",
            authDomain: "mapa-comarca.firebaseapp.com",
            projectId: "mapa-comarca",
            storageBucket: "mapa-comarca.firebasestorage.app",
            messagingSenderId: "369057855767",
            appId: "1:369057855767:web:68fa4a6a85e811dc149f52"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "mensajes");
        const miId = Math.random().toString(36).substring(7);

        let estadoActual = "ninguno";

        window.setEstado = (nuevo, el) => {
            estadoActual = nuevo;
            document.querySelectorAll('.opcion-estado').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
        };

        window.enviarMensaje = async () => {
            const input = document.getElementById('chat-input');
            if (input.value.trim() !== "") {
                await addDoc(colRef, {
                    texto: input.value,
                    id: miId,
                    estado: estadoActual,
                    tiempo: serverTimestamp()
                });
                input.value = "";
            }
        };

        const q = query(colRef, orderBy("tiempo", "asc"), limit(50)); // Aumentamos el límite
        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('chat-messages');
            contenedor.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                
                const estadoDoc = data.estado || 'ninguno';
                div.className = `msg ${estadoDoc} ${data.id === miId ? 'user' : 'other'}`;
                
                const nombresEstados = { 
                    "espera": "ESPERANDO", 
                    "viaje": "EN VIAJE", 
                    "ninguno": "" 
                };

                // Formateamos el tiempo
                const horaHtml = data.tiempo ? new Date(data.tiempo.seconds * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                
                // Estructura interna más compacta
                div.innerHTML = `
                    <div style="font-weight: 500; font-size: 13px;">${data.texto}</div>
                    <div class="meta-info">
                        ${estadoDoc !== 'ninguno' ? `<span style="font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">${nombresEstados[estadoDoc]}</span>` : '<span></span>'}
                        <span>${horaHtml}</span>
                    </div>
                `;
                contenedor.appendChild(div);
            });
            contenedor.scrollTop = contenedor.scrollHeight;
        });
    </script>
</body>
</html>
